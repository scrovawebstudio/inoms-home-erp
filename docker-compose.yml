version: '3.8'

services:
  inoms-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inoms-home
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MASTER_PIN=814986
    volumes:
      - ./data:/app/data

